name: Release

on:
  # Trigger the workflow on push on the main branch
  push:
    branches:
      - main
    paths-ignore:
      - 'CODEOWNERS'
      - '**.md'
      - '.**'
      - 'version'

jobs:
  release:
    name: Release
    runs-on: ubuntu-22.04

    steps:

      - name: 🚀 Release with docker action
        id: release
        uses: pagopa/eng-github-actions-iac-template/global/release-action@main #
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}


      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0

      - name: Update application version
        run: echo ${{steps.release.outputs.new_release_version }} > version

      - name: Push changes
        run: |
          git config set --local user.email "github-actions[bot]@users.noreply.github.com"
          git config set --local user.name "p4pa-pagopa-github-bot"
          git add version
          git commit -m "Bump version"
          git config unset --local remote.origin.url
          git config set --local remote.origin.url 'https://p4pa-pagopa-github-bot:${{ secrets.ADMIN_GITHUB_TOKEN_RW }}@github.com/pagopa/p4pa-payhub-activities.git'
          git config unset --local http.https://github.com/.extraheader ||true # ignored error if not exists
          git push origin ${{ github.ref }}
